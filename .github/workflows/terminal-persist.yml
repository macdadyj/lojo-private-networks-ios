name: Terminal persistence

on:
  push:
    paths:
      - "App/Sources/LojoSSH/**"
      - "App/Sources/LojoNetworks/Terminal/**"
      - "tools/terminal-persist/**"
      - "tools/terminal-scrollback/**"
      - "App/Sources/LojoTerminalScroll/**"
      - "App/Tests/LojoNetworksTests/**"
      - ".github/workflows/terminal-persist.yml"
  pull_request:

jobs:
  unit-tests:
    name: Reconnect and tmux tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            setup: true
          - os: macos-15
            setup: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift
        if: matrix.setup
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Reconnect and tmux tests
        working-directory: tools/terminal-persist
        run: swift test
      - name: Scrollback tests
        working-directory: tools/terminal-scrollback
        run: swift test

  ios-simulator:
    name: iOS Simulator build and screenshots
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture demo screens
        run: bash scripts/ios-simulator-ci.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: .build/ios-simulator-shots/*.png
          if-no-files-found: ignore
