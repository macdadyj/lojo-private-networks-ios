# Generated into LojoNetworks.xcodeproj by XcodeGen during macOS CI.
# xtool still builds the phone from Package.swift; this project exists so
# `xcodebuild` can compile the same sources for the iOS Simulator.
name: LojoNetworks
options:
  bundleIdPrefix: com.lojo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    DEFINES_MODULE: YES
    # Generic Simulator builds x86_64 and arm64. swift-atomics then fails to
    # emit `_AtomicsShims` for the extra slice. The runners are arm64.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.103.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.15.0
  swift-nio-transport-services:
    url: https://github.com/apple/swift-nio-transport-services.git
    from: 1.28.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 4.5.0
  SwiftTerm:
    path: Vendor/SwiftTerm
targets:
  LojoSSH:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/LojoSSH
    dependencies:
      - package: swift-nio
        product: NIOConcurrencyHelpers
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio-transport-services
        product: NIOTransportServices
      - package: swift-crypto
        product: Crypto
  LojoTrust:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/LojoTrust
  LojoNetworks:
    type: application
    platform: iOS
    sources:
      - path: Sources/LojoNetworks
    dependencies:
      - target: LojoSSH
      - target: LojoTrust
      - target: LojoTerminalScroll
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.PrivateNetworks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.2"
        ENABLE_PREVIEWS: NO
  LojoTerminalScroll:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/LojoTerminalScroll
  LojoNetworksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LojoNetworksTests
    dependencies:
      - target: LojoTerminalScroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.PrivateNetworks.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  LojoNetworksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LojoNetworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.PrivateNetworks.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LojoNetworks
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  LojoNetworks:
    build:
      targets:
        LojoNetworks: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LojoNetworksTests
    archive:
      config: Release
      customArchiveName: LojoNetworks
  LojoNetworksUI:
    build:
      targets:
        LojoNetworks: all
        LojoNetworksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LojoNetworksUITests
